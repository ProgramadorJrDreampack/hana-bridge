[project]
name = "hana-bridge"
version = "2.0.0"
description = "Microservicio intermediario seguro entre MIL y SAP HANA (BEAS + SAP B1)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "hdbcli>=2.19",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.3", "mypy>=1.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true   # hdbcli no trae stubs
